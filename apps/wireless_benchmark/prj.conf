# The application owns the radio. Bluetooth and USB are not part of this test.
CONFIG_ESB=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_ESB_PIPE_COUNT=1
CONFIG_ESB_TX_FIFO_SIZE=8
CONFIG_ESB_RX_FIFO_SIZE=16
CONFIG_ESB_SYS_TIMER10=y
CONFIG_NRFX_TIMER=y

# Keep symbols and useful locals for RAM inspection. Do not benchmark while halted.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_GPIO=y
CONFIG_ENTROPY_GENERATOR=y

# Keep CPU/peripheral wake latency short during this timing experiment. This
# consumes extra power: these measurements are not a battery-life benchmark.
CONFIG_SOC_NRF_FORCE_CONSTLAT=y
CONFIG_NRF_SYS_EVENT=y
CONFIG_NRF_SYS_EVENT_GRTC_CHAN_CNT=0

# Low-rate status uses UART20 EasyDMA directly, outside the radio callbacks.
# Keep its pins/peripheral active to avoid repeated IRQ-locked power transitions.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_20_ASYNC=y
CONFIG_UART_20_NRF_ASYNC_LOW_POWER=n
# No per-packet logging: its cost would swamp a 125 us schedule.
CONFIG_LOG=n
# UART20 has one owner. Do not let a console/log backend interleave bytes.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
